{% extends "base.html" %}
{% block title %}Upload{% endblock %}
{% block content %}
<h1>Photo, file or voice note</h1>
<form method="post" action="/upload" enctype="multipart/form-data" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="f">File</label><input id="f" type="file" name="file" accept="image/*,application/pdf,audio/*,text/plain,text/csv" capture="environment" required>
  <label for="k">What is it?</label><select id="k" name="kind">{% for k in kinds %}<option {{ 'selected' if k == 'photo' }}>{{ k }}</option>{% endfor %}</select>
  <label for="j">Job</label><select id="j" name="job">{% if actor.can("read:all") %}<option value="">— none —</option>{% endif %}{% for x in jobs_list %}<option value="{{ x.id }}" {{ 'selected' if job == x.id }}>{{ x.name }} ({{ x.ref }})</option>{% endfor %}</select>
  <label for="t">Title (optional)</label><input id="t" name="title">
  <p class="muted">Max 25 MB. PDFs, images, audio, text/CSV. Zip/Office archives and HTML are refused. Voice notes are stored; transcription is not connected yet.</p>
  <p><button type="submit" style="width:100%">Upload</button></p>
</form>
{% endblock %}
