# Construction Hermes - HERMES_HOME/config.yaml
# Verified against hermes-agent v2026.9.24 (v0.21.5, commit f97608f178d1ffeca59860195ab7da295f7c8e5f).
# Secrets never go here: CHOPS_MCP_TOKEN, provider API keys and TELEGRAM_* live in HERMES_HOME/.env (mode 600).

model:
  # Unset on purpose. Choose a provider/model you have credentials for, then:
  #   hermes config set model.default <provider/model>   (or edit here)
  # Hermes does NOT get credentials from a Claude subscription.
  default: ""
  provider: auto

auth:
  # Never borrow Claude Code / Codex CLI logins from this machine.
  adopt_external_logins: false

mcp_servers:
  construction:
    url: "${CHOPS_MCP_URL}"              # docker: http://mcp:8641/mcp ; host install: http://127.0.0.1:8641/mcp
    headers:
      Authorization: "Bearer ${CHOPS_MCP_TOKEN}"
      X-Hermes-Profile: "construction"
    timeout: 120
    connect_timeout: 30
    # The service enforces policy server-side; tool annotations mark read-only tools.
    trust: full
    tools:
      resources: false
      prompts: false
    elicitation:
      enabled: true       # owner_decision asks the owner directly through Hermes' approval prompt
      timeout: 300

# Narrow surface: construction tools + conversation helpers. No shell, files, browser, web,
# code execution, delegation, cron, or connectors: the only write path is the policy-enforcing
# construction service.
platform_toolsets:
  cli: [construction, memory, clarify, todo, session_search, vision, skills]
  telegram: [construction, memory, clarify, todo, session_search, vision, skills]

agent:
  max_turns: 40
  disabled_toolsets:
    - terminal
    - file
    - browser
    - code_execution
    - web
    - search
    - computer_use
    - delegation
    - cronjob
    - homeassistant
    - image_gen
    - video_gen
    - video
    - connections
    - kanban
    - spotify
    - x_search
    - tts

skills:
  # Learned skills are staged for owner review, never applied silently.
  write_approval: true
  creation_nudge_interval: 0

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 1500
  user_char_limit: 1000

telemetry:
  shared_metrics:
    enabled: false
    send: false

updates:
  check: false
